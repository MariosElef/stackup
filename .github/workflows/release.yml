# A tag like v0.1.0 (`git tag v0.1.0 && git push origin v0.1.0`) builds stackup for each system and
# attaches the archives, a checksum for each, and a setup program for Windows to a GitHub release.
# The install scripts and the packages in /packaging point at those archives. Run by hand (Actions
# → release → Run workflow) it only builds, to try it: the files are on the run's page.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, archive: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, archive: tar.gz }
          # Both Macs build on Apple Silicon: GitHub has no Intel runner left to rely on, and Rust
          # builds for Intel from there.
          - { os: macos-latest, target: x86_64-apple-darwin, archive: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          name="stackup-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/stackup" README.md LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "stackup-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/stackup.exe", README.md, LICENSE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File "$name.zip.sha256" -Encoding ascii
          "ASSET=$name.zip" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
      # One setup program to download and double-click, beside the zip that install.ps1, Scoop
      # and winget use. Named with Cargo.toml's version.
      - name: Make the Windows installer
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          New-Item -ItemType Directory -Force dist/stackup | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/stackup.exe" dist/stackup/
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\windows\stackup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = "stackup-$version-windows-x64-setup.exe"
          Move-Item "dist/$setup" $setup
          (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower() + "  $setup" | Out-File "$setup.sha256" -Encoding ascii
          "SETUP=$setup" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
            ${{ env.SETUP }}
            ${{ env.SETUP }}.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
